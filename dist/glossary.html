<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="./glossary.css">
<title>Pokémon TCG 詞彙管理</title>
</head>
<body>
<header class="topbar"><a href="./" class="back">← 返回翻譯</a><div><h1>Pokémon TCG 詞彙管理</h1><p id="account">正在確認帳號…</p></div></header>
<main>
<section class="card editor">
  <div class="section-head"><h2 id="form-title">新增詞彙</h2><button id="new" type="button" class="text-button">清空</button></div>
  <form id="form">
    <input id="id" type="hidden">
    <label>日文／英文原文<input id="source" maxlength="160" required placeholder="例：メガルカリオex"></label>
    <label>繁中固定譯名<input id="target" maxlength="200" required placeholder="例：超級路卡利歐ex"></label>
    <div class="grid">
      <label>語言<select id="language"><option value="ja">日文</option><option value="en">英文</option><option value="ko">韓文</option><option value="shared">共用</option></select></label>
      <label>分類<input id="category" maxlength="80" list="categories" value="寶可夢名稱"></label>
    </div>
    <datalist id="categories"><option value="寶可夢名稱"><option value="特性／招式／牌組原型"><option value="物品卡"><option value="支援者"><option value="寶可夢道具"><option value="場地"><option value="能量"><option value="賽事與專有名詞"><option value="環境與機制相關"><option value="其他"></datalist>
    <label>備註<input id="note" maxlength="400" placeholder="選填，例如：某寶可夢特性／招式"></label>
    <label class="check"><input id="enabled" type="checkbox" checked> 啟用此詞彙</label>
    <div class="actions"><button class="primary" type="submit">儲存詞彙</button><button id="cancel" class="secondary" type="button">取消編輯</button></div>
  </form>
  <p id="message" class="message" role="status"></p>
</section>

<section class="card list-card">
  <div class="section-head"><h2>目前詞彙 <span id="count">0</span></h2></div>
  <input id="search" class="search" placeholder="搜尋日文、繁中或分類">
  <div id="list" class="list"></div>
</section>
</main>
<script src="./vendor/supabase/supabase.js"></script>
<script type="module" src="./glossary.js"></script>
</body>
</html>
